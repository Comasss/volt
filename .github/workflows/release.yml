# Publica una versión: al subir una etiqueta `vX.Y.Z` (o a mano desde Actions),
# compila el instalador de Windows y lo sube a GitHub Releases.
#
#   1. node scripts/bump-version.mjs 0.2.0   (cambia la versión en los 3 sitios)
#   2. git commit -am "Volt 0.2.0" && git tag v0.2.0 && git push --follow-tags
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: La etiqueta coincide con la versión de la app
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con la versión de tauri.conf.json (v$version). Usa scripts/bump-version.mjs."
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependencias del frontend
        run: npm ci

      - name: Compila y publica el instalador
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Volt v__VERSION__
          releaseBody: |
            Instalador para Windows 10/11 (x64): el archivo **Volt_…_x64-setup.exe** de abajo.

            - Windows SmartScreen puede avisar porque el instalador no está firmado: «Más información» → «Ejecutar de todas formas».
            - `hid-list.exe` es la herramienta de diagnóstico (lista VID/PID y prueba los providers: `hid-list.exe --probe`).
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false

      - name: Adjunta hid-list.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri.outputs.appVersion }}" src-tauri/target/release/hid-list.exe --clobber
