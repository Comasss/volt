# Publica una versión: al subir una etiqueta `vX.Y.Z` (o a mano desde Actions),
# compila el instalador de Windows y los paquetes de Linux y los sube a GitHub Releases.
#
#   1. node scripts/bump-version.mjs 0.2.0   (cambia la versión en los 3 sitios)
#   2. git commit -am "Volt 0.2.0" && git tag v0.2.0 && git push --follow-tags
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # 22.04 y no la última: el AppImage/.deb hereda la glibc del runner, y
          # cuanto más antigua, en más distribuciones funciona.
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: La etiqueta coincide con la versión de la app
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con la versión de tauri.conf.json (v$version). Usa scripts/bump-version.mjs."
          }

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependencias del frontend
        run: npm ci

      # Los dos trabajos crean/actualizan la misma release (tauri-action la busca
      # por etiqueta), así que cada uno sube solo sus archivos.
      - name: Compila y publica
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: v__VERSION__
          releaseName: Volt v__VERSION__
          releaseBody: |
            **Windows 10/11 (x64):** el instalador **Volt_…_x64-setup.exe**.
            - Windows SmartScreen puede avisar porque el instalador no está firmado: «Más información» → «Ejecutar de todas formas».
            - `hid-list.exe` es la herramienta de diagnóstico (lista VID/PID y prueba los providers: `hid-list.exe --probe`).

            **Linux (x64):** el paquete **.deb** (Debian/Ubuntu) o el **.AppImage** (cualquier distribución).
            - Para leer los receptores USB sin `sudo`, tu usuario necesita acceso a `/dev/hidraw*` (regla udev; ver el README).
            - `hid-list-linux-x64` es la misma herramienta de diagnóstico.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false

      - name: Adjunta hid-list (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri.outputs.appVersion }}" src-tauri/target/release/hid-list.exe --clobber

      - name: Adjunta hid-list (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/hid-list hid-list-linux-x64
          gh release upload "v${{ steps.tauri.outputs.appVersion }}" hid-list-linux-x64 --clobber
